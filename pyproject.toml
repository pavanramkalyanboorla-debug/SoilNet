[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soilnet-classifier"
version = "1.0.0"
description = "Lightweight CNN soil classification — transfer learning, FastAPI, Streamlit, Docker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "scikit-learn>=1.0",
    "tensorflow-cpu==2.21.0",
    "pillow>=9.0",
    "fastapi>=0.85",
    "uvicorn[standard]>=0.18",
    "streamlit>=1.20",
    "python-multipart>=0.0.5",
    "requests>=2.28",
    "plotly>=5.5",
    "huggingface_hub>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0",
]